<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="fryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#E58E00" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(5, 5)">
    <!-- Fry Container Box -->
    <path d="M12 25 L38 25 L34 48 L16 48 Z" fill="url(#boxGrad)" filter="url(#dropShadow)" />
    <path d="M12 25 Q25 30 38 25 L35 32 Q25 36 15 32 Z" fill="#D32F2F" />

    <!-- Golden Fry Sticks -->
    <rect x="15" y="8" width="4" height="20" rx="1.5" fill="url(#fryGrad)" transform="rotate(-12 17 18)" />
    <rect x="21" y="4" width="4.5" height="24" rx="1.5" fill="url(#fryGrad)" transform="rotate(-3 23 16)" />
    <rect x="27" y="6" width="4" height="22" rx="1.5" fill="url(#fryGrad)" transform="rotate(8 29 17)" />
    <rect x="32" y="11" width="3.5" height="18" rx="1.5" fill="url(#fryGrad)" transform="rotate(18 34 20)" />

    <!-- Accent Salt Crystals / Sparkle -->
    <circle cx="20" cy="6" r="1" fill="#FFFFFF" />
    <circle cx="28" cy="8" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="34" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#1E1611" letter-spacing="-0.5">
    FRY<tspan fill="#E58E00">SPOT</tspan>
  </text>
  <text x="62" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#8C7A6B" letter-spacing="1.5">
    BURGER KING FRIES GUIDE
  </text>
</svg>
