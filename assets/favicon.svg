<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50" fill="none">
  <defs>
    <linearGradient id="fryGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#E58E00" />
    </linearGradient>
    <linearGradient id="boxGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Only Logo Mark (No Text) for Favicon -->
  <g id="logoMark" filter="url(#favDropShadow)">
    <!-- Golden Fry Sticks -->
    <rect x="15" y="8" width="4.2" height="21" rx="1.5" fill="url(#fryGradFav)" transform="rotate(-12 17 18)" />
    <rect x="21" y="4" width="4.8" height="25" rx="1.5" fill="url(#fryGradFav)" transform="rotate(-3 23 16)" />
    <rect x="27" y="6" width="4.2" height="23" rx="1.5" fill="url(#fryGradFav)" transform="rotate(8 29 17)" />
    <rect x="32" y="11" width="3.8" height="19" rx="1.5" fill="url(#fryGradFav)" transform="rotate(18 34 20)" />

    <!-- Salt Crystals -->
    <circle cx="20" cy="6" r="1.2" fill="#FFFFFF" />
    <circle cx="28" cy="8" r="1.4" fill="#FFFFFF" />

    <!-- Red Fry Container Box -->
    <path d="M12 25 L38 25 L34 47 L16 47 Z" fill="url(#boxGradFav)" />
    <path d="M12 25 Q25 30 38 25 L35 32 Q25 36 15 32 Z" fill="#D32F2F" />
  </g>
</svg>
